[project]
name = "tgbot-message-to-hebrew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "langdetect>=1.0.9",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# Apple Silicon only — requires macOS + Apple Silicon hardware.
# Install: uv sync --extra local
local = [
    "mlx-lm>=0.24",
    "nakdimon>=0.2",
]
# For testing DictaLM 3.0 via PyTorch MPS (transformers already a transitive dep of mlx-lm).
# Install: uv sync --extra v3
v3 = [
    "torch>=2.3",
    "transformers>=4.45",
    "accelerate>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
